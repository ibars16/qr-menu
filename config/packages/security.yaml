security:
    # The login tells "no account with this email" apart from "wrong
    # password" (SecurityController::loginError()). Symfony hides that by
    # default against account enumeration, but /register already answers
    # "ya hay una cuenta con ese email", and login_throttling caps guessing.
    expose_security_errors: all

    password_hashers:
        App\Entity\User:
            algorithm: bcrypt

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            form_login:
                login_path: admin_login
                check_path: admin_login
                username_parameter: email
                password_parameter: password
                default_target_path: admin_menu
                enable_csrf: true

            logout:
                path: admin_logout
                target: admin_login

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800

            # Defaults: 5 failed logins per minute per email+IP (and more per
            # IP alone). Its message is translated by Symfony's own
            # "security" domain.
            login_throttling: null

            # "Entrar" as a restaurant's owner: the platform owner anywhere
            # (BillingController::pay()), a reseller only into its own
            # restaurants; the platform owner also as a reseller (/platform's
            # reseller table) — see App\Security\SwitchUserVoter.
            # ?_switch_user=_exit to leave.
            switch_user:
                role: CAN_SWITCH_USER

    # Owner (User::ROLE_OWNER) automatically satisfies any ROLE_STAFF check
    # too — the per-restaurant "full access vs content-only" split lives in
    # each Admin\*Controller's own #[IsGranted], not here.
    role_hierarchy:
        ROLE_OWNER: ROLE_STAFF

    access_control:
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/register,    roles: PUBLIC_ACCESS }
        - { path: ^/alta/,       roles: PUBLIC_ACCESS }
        - { path: ^/partners/registro, roles: PUBLIC_ACCESS }
        - { path: ^/partners,    roles: ROLE_RESELLER }
        - { path: ^/admin,       roles: ROLE_USER }
        - { path: ^/platform,    roles: ROLE_SUPER_ADMIN }
        - { path: ^/r/,          roles: PUBLIC_ACCESS }
        - { path: ^/stripe/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/stripe/connect-account-events, roles: PUBLIC_ACCESS }
        - { path: ^/stripe/connect-webhook, roles: PUBLIC_ACCESS }
