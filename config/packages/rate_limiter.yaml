framework:
    rate_limiter:
        # "Forgot password" requests (ResetPasswordController): 3 per email
        # and 10 per IP, per hour. Past either, the page answers exactly as
        # usual and simply sends nothing.
        reset_password_email:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        reset_password_ip:
            policy: sliding_window
            limit: 10
            interval: '1 hour'

        # Dish photos generated with AI (App\Service\DishPhoto\DishPhotoQuota):
        # a technical brake against loops and repeated clicks, for every
        # restaurant (paying ones have no other limit). Per restaurant: 60 an
        # hour, 300 a day; per dish: 10 an hour.
        ai_photo_hour:
            policy: sliding_window
            limit: 60
            interval: '1 hour'
        ai_photo_day:
            policy: sliding_window
            limit: 300
            interval: '1 day'
        ai_photo_dish:
            policy: sliding_window
            limit: 10
            interval: '1 hour'

        # The public menu's loading screen (MenuController::warmTranslations(),
        # it calls the AI): 20 every 10 minutes per IP, across restaurants.
        # A normal visit makes one per language, and only when something is
        # missing. Past it: 429, and the loading screen shows the menu anyway.
        # Counted in its own pool (cache.yaml); in memory in tests (below).
        menu_warm_ip:
            policy: sliding_window
            limit: 20
            interval: '10 minutes'
            cache_pool: cache.menu_warm_limiter

when@test:
    framework:
        rate_limiter:
            # Same limit, counted in memory for one test's kernel only
            # (services.yaml, when@test): the suite's many loading-screen
            # requests from 127.0.0.1 never add up across tests or runs.
            menu_warm_ip:
                policy: sliding_window
                limit: 20
                interval: '10 minutes'
                cache_pool: app.test.menu_warm_limiter_pool
