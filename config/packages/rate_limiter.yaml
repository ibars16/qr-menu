framework:
    rate_limiter:
        # "Forgot password" requests (ResetPasswordController): 3 per email
        # and 10 per IP, per hour. Past either, the page answers exactly as
        # usual and simply sends nothing.
        reset_password_email:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        reset_password_ip:
            policy: sliding_window
            limit: 10
            interval: '1 hour'

        # Dish photos generated with AI (App\Service\DishPhoto\DishPhotoQuota):
        # a technical brake against loops and repeated clicks, for every
        # restaurant (paying ones have no other limit). Per restaurant: 60 an
        # hour, 300 a day; per dish: 10 an hour.
        ai_photo_hour:
            policy: sliding_window
            limit: 60
            interval: '1 hour'
        ai_photo_day:
            policy: sliding_window
            limit: 300
            interval: '1 day'
        ai_photo_dish:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
