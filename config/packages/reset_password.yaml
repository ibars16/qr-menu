symfonycasts_reset_password:
    request_password_repository: App\Repository\ResetPasswordRequestRepository
    # The link works for 1 hour and only once.
    lifetime: 3600
    # The bundle's own "one request per X" throttle is off (0): the limits
    # are the rate limiters (3 per email and 10 per IP, per hour — see
    # rate_limiter.yaml); the bundle's would block a legitimate 2nd request.
    throttle_limit: 0
    enable_garbage_collection: true
