parameters:
    exchange_api_key:  '%env(EXCHANGE_API_KEY)%'
    gemini_api_key:    '%env(GEMINI_API_KEY)%'
    mailer_from_email:      '%env(MAILER_FROM_EMAIL)%'
    platform_admin_email:   '%env(PLATFORM_ADMIN_EMAIL)%'
    # Physical folder for every uploaded file (logos/, heroes/, products/,
    # menu-imports/). Public URLs and the paths stored in the DB stay
    # "uploads/..." — only the folder on disk moves (see when@test below).
    app.uploads_dir:        '%kernel.project_dir%/public/uploads'

    # Subscription prices in euros — the ONLY place they're written. Shown
    # in the admin (plan dialog, expired page) as a translation variable;
    # what Stripe actually charges is the Price behind STRIPE_PRICE_* below,
    # so keep both in sync when prices change.
    app.billing_prices:
        monthly: 30
        yearly: 300

    # Restaurants a reseller's base plan includes; each one in use over
    # this is an extra (Controller\Partners\PartnersController).
    app.reseller_included_restaurants: 5

    # Stripe (see App\Service\Billing\StripeBilling). Values go in
    # .env.local; empty defaults here so the app still boots without them.
    env(STRIPE_SECRET_KEY): ''
    env(STRIPE_WEBHOOK_SECRET): ''
    env(STRIPE_PRICE_MONTHLY): ''
    env(STRIPE_PRICE_YEARLY): ''

services:

    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Service\ExchangeRateUpdater:
        arguments:
            $exchangeApiKey: '%exchange_api_key%'

    App\Service\SmartWaiterFailureAlertMailer:
        arguments:
            $fromEmail: '%mailer_from_email%'
            $platformAdminEmail: '%platform_admin_email%'

    App\Service\DefaultTagSeeder:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\AdminLocaleResolver:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\MenuPreferencesResolver:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\PublicSiteLocaleResolver:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Command\SeedPresetTagsCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Command\ResyncPresetTagTranslationsCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Command\CleanOrphanLogosCommand:
        arguments:
            $uploadsDir: '%app.uploads_dir%'

    App\Twig\ImageSizeExtension:
        arguments:
            $uploadsDir: '%app.uploads_dir%'

    App\Command\GenerateGlobalIngredientsDatasetCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Command\ImportGlobalIngredientsCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $geminiApiKey: '%gemini_api_key%'

    App\Service\GeminiIngredientTranslator:
        arguments:
            $geminiApiKey: '%gemini_api_key%'

    App\Service\IngredientTranslatorInterface:
        alias: App\Service\GeminiIngredientTranslator

    # Routed through AIModelRouter's "capable" tier (see
    # RouterProductTranslator's docblock) rather than calling Gemini
    # directly like the ingredient translator above — dish, category and
    # tag names need better multilingual quality than a free lite model
    # reliably gives in lower-resource languages.
    App\Service\ProductTranslatorInterface:
        alias: App\Service\RouterProductTranslator

    App\Service\CategoryTranslatorInterface:
        alias: App\Service\RouterCategoryTranslator

    App\Service\TagTranslatorInterface:
        alias: App\Service\RouterTagTranslator

    App\Service\TagTranslationProviderInterface:
        alias: App\Service\DatabaseTagTranslationProvider

    App\Service\AllergenSeeder:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\GlobalIngredientAllergenSeeder:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Classification\GeminiClassifierProvider:
        arguments:
            $geminiApiKey: '%gemini_api_key%'

    App\Service\Classification\AiClassifierProviderInterface:
        alias: App\Service\Classification\GeminiClassifierProvider

    App\Command\ClassifyExportCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Command\AllergenBackfillCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Command\TranslateGlobalIngredientsCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Command\MenuEvalCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\AI\AIProviderFactory:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\AI\AIModelRouter:
        arguments:
            $logger: '@monolog.logger.smart_waiter'

    App\Service\AI\ChatComplexityClassifierInterface:
        alias: App\Service\AI\HeuristicChatComplexityClassifier

    App\Service\MenuImportExtractionService:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $uploadsDir: '%app.uploads_dir%'

    App\Controller\Admin\MenuAdminController:
        arguments:
            $kernelEnvironment: '%kernel.environment%'

    App\Service\MenuImportPipeline:
        arguments:
            $logger: '@monolog.logger.menu_import'

    App\Service\ProcessSpawningBatchProcessingTrigger:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $kernelEnvironment: '%kernel.environment%'
            $logger: '@monolog.logger.menu_import'

    App\Service\BatchProcessingTriggerInterface:
        alias: App\Service\ProcessSpawningBatchProcessingTrigger

    App\Service\Upload\ContentModerationInterface:
        alias: App\Service\Upload\NullContentModeration

    # API version pinned so a Stripe SDK upgrade never silently changes the
    # shape of what we read (period ends, invoice → subscription link).
    Stripe\StripeClient:
        arguments:
            - api_key: '%env(STRIPE_SECRET_KEY)%'
              stripe_version: '2026-09-30.endive'

    App\Service\Billing\StripeGatewayInterface:
        alias: App\Service\Billing\StripeGateway

    App\Service\Billing\StripeBilling:
        arguments:
            $priceIds:
                monthly: '%env(STRIPE_PRICE_MONTHLY)%'
                yearly: '%env(STRIPE_PRICE_YEARLY)%'

    App\Controller\StripeWebhookController:
        arguments:
            $webhookSecret: '%env(STRIPE_WEBHOOK_SECRET)%'

# Tests never write into the real public/uploads: upload tests use this
# folder and empty it in their tearDown.
when@test:
    parameters:
        app.uploads_dir: '%kernel.project_dir%/var/test-uploads'

    # Tests never call Stripe.
    services:
        App\Tests\Support\FakeStripeGateway: ~
        App\Service\Billing\StripeGatewayInterface:
            alias: App\Tests\Support\FakeStripeGateway
