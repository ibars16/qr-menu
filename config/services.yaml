parameters:
    exchange_api_key:  '%env(EXCHANGE_API_KEY)%'
    gemini_api_key:    '%env(GEMINI_API_KEY)%'
    mailer_from_email:      '%env(MAILER_FROM_EMAIL)%'
    platform_admin_email:   '%env(PLATFORM_ADMIN_EMAIL)%'

services:

    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Service\ExchangeRateUpdater:
        arguments:
            $exchangeApiKey: '%exchange_api_key%'

    App\Service\SmartWaiterFailureAlertMailer:
        arguments:
            $fromEmail: '%mailer_from_email%'
            $platformAdminEmail: '%platform_admin_email%'

    App\Service\DefaultTagSeeder:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\AdminLocaleResolver:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\MenuPreferencesResolver:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\PublicSiteLocaleResolver:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Command\SeedPresetTagsCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Command\ResyncPresetTagTranslationsCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Command\GenerateGlobalIngredientsDatasetCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Command\ImportGlobalIngredientsCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $geminiApiKey: '%gemini_api_key%'

    App\Service\GeminiTagTranslator:
        arguments:
            $geminiApiKey: '%gemini_api_key%'

    App\Service\TagTranslatorInterface:
        alias: App\Service\GeminiTagTranslator

    App\Service\GeminiIngredientTranslator:
        arguments:
            $geminiApiKey: '%gemini_api_key%'

    App\Service\IngredientTranslatorInterface:
        alias: App\Service\GeminiIngredientTranslator

    # Routed through AIModelRouter's "capable" tier (see
    # RouterProductTranslator's docblock) rather than calling Gemini
    # directly like the tag/ingredient translators above — dish and
    # category names need better multilingual quality than a free lite
    # model reliably gives in lower-resource languages.
    App\Service\ProductTranslatorInterface:
        alias: App\Service\RouterProductTranslator

    App\Service\CategoryTranslatorInterface:
        alias: App\Service\RouterCategoryTranslator

    App\Service\TagTranslationProviderInterface:
        alias: App\Service\DatabaseTagTranslationProvider

    App\Service\AllergenSeeder:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\GlobalIngredientAllergenSeeder:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Classification\GeminiClassifierProvider:
        arguments:
            $geminiApiKey: '%gemini_api_key%'

    App\Service\Classification\AiClassifierProviderInterface:
        alias: App\Service\Classification\GeminiClassifierProvider

    App\Command\ClassifyExportCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Command\MenuEvalCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\AI\AIProviderFactory:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\AI\AIModelRouter:
        arguments:
            $logger: '@monolog.logger.smart_waiter'

    App\Service\AI\ChatComplexityClassifierInterface:
        alias: App\Service\AI\HeuristicChatComplexityClassifier

    App\Service\MenuImportExtractionService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\MenuImportPipeline:
        arguments:
            $logger: '@monolog.logger.menu_import'

    App\Service\ProcessSpawningBatchProcessingTrigger:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $kernelEnvironment: '%kernel.environment%'
            $logger: '@monolog.logger.menu_import'

    App\Service\BatchProcessingTriggerInterface:
        alias: App\Service\ProcessSpawningBatchProcessingTrigger
