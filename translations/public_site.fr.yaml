faq:
  eyebrow: "Questions fréquentes"
  title: "Avant que vous ne demandiez"
  q1:
    q: "Ai-je besoin d'une carte bancaire pour l'essai ?"
    a: "Non. L'essai d'1 mois est entièrement gratuit, sans carte ni engagement."
  q2:
    q: "Puis-je importer la carte que j'ai déjà ?"
    a: "Oui. Téléchargez une photo de votre carte actuelle et l'IA l'organise automatiquement par catégories et plats."
  q3:
    q: "Mes clients doivent-ils installer quelque chose ?"
    a: "Non. Ils scannent le QR code et voient la carte directement dans le navigateur de leur mobile."
  q4:
    q: "En combien de langues ma carte peut-elle s'afficher ?"
    a: "Elle est traduite automatiquement en 20 langues, sans rien à faire de votre part."
  q5:
    q: "Que se passe-t-il à la fin du mois d'essai ?"
    a: "Votre carte est mise en pause jusqu'à ce que vous choisissiez une formule. Rien n'est prélevé automatiquement, car nous ne vous demandons pas de carte."
  price:
    q: "Combien ça coûte ?"
    a: "%monthly% par mois ou %yearly% par an, TVA incluse. Une seule formule, tout compris, et le premier mois est gratuit, sans carte."

features:
  eyebrow: "Fonctionnalités"
