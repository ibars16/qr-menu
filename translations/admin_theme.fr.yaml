layout:
    standard:
        name: Standard
        desc: Cartes avec image en haut et nom en dessous. Équilibré et percutant.

theme:
    classic-dark:
        name: Classique sombre
        desc: Noir profond, accent orange et touches de bronze. Moderne et urbain.
    glass:
        name: Glassmorphism
        desc: Dégradé nocturne, surfaces de verre et accent violet. Moderne et premium.
    ocean:
        name: Océan
        desc: 'Bleu d''eau, bandeau et titres bleu marine, accent turquoise. Idéal pour une cuisine de la mer.'
    noir:
        name: Noir
        desc: Noir absolu et touches or champagne. Luxe et haute gastronomie.
    forest:
        name: Forêt
        desc: Vert sauge, bandeau et titres vert forêt, touches terracotta. Parfait pour une cuisine de marché et des produits locaux.
    maison:
        name: Classique clair
        desc: Parchemin et ivoire, accent bordeaux et touches de laiton. Gastronomie et raffinement.
