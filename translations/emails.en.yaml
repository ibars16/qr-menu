welcome:
    subject: "Welcome to %app%"
    hello: "Hello!"
    ready: "Your account is ready."
    button: "Go to your dashboard"
    login_with: "You sign in with this email: %email%"
    forgot: "If you forget your password, use “Forgot your password?” on the sign-in screen."
    confirm_intro: "Confirm your email to publish your menu: until then only you can see it."
reset:
    subject: "Change your password"
    intro: "We received a request to change the password for your account."
    button: "Change password"
    expiry: "The link expires in 1 hour and can only be used once."
    ignore: "If you didn't request this, ignore this email: your password won't change."
confirm:
    subject: "Confirm your email"
    intro: "Confirm this is your email so your customers can see your menu."
    button: "Confirm my email"
    expiry: "The link expires in 7 days. If it does, ask for a new one from your panel."
    ignore: "If you didn't create this account, ignore this email."
email_change:
    subject: "Confirm your new email"
    intro: "You asked to log in to %app% with %new% instead of %old%. Confirm it to make the change."
    button: "Confirm the new email"
    expiry: "The link expires in 7 days. Until you confirm, you keep logging in with your current email."
    ignore: "If you didn't ask for this, ignore this email: nothing changes."
email_changed:
    subject: "Your login email has changed"
    intro: "From now on this account logs in with %new%. This email can no longer be used to log in."
    not_you: "If this wasn't you, contact %app% support as soon as possible."
