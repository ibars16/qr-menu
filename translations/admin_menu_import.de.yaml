        pdf_too_many_pages: '„%name%" hat %pages% Seiten, in diesen Upload passen höchstens %max%. Lade es in mehreren Durchgängen hoch oder entferne Seiten.'
        pdf_password: '„%name%" ist passwortgeschützt. Entferne das Passwort oder lade Fotos der Speisekarte hoch.'
        pdf_unreadable: '„%name%" konnte nicht geöffnet werden. Prüfe, ob es ein gültiges PDF ist, oder lade Fotos der Speisekarte hoch.'
        pdf_no_pages: '„%name%" hat keine Seiten.'

status:
