title: Personalizar cardápio

confirm:
    default_title: Aplicar alteração
    default_sub: A alteração será visível imediatamente para todos os visitantes do seu cardápio.
    cancel: Cancelar
    apply_now: Aplicar agora
    applying: A aplicar…
    use_layout_title: 'Usar o layout "%name%"?'
    use_layout_sub: Será aplicado imediatamente e todos os seus clientes verão o novo layout.
    use_theme_title: 'Usar o tema "%name%"?'
    use_theme_sub: Será aplicado imediatamente e todos os seus clientes verão o novo tema.
    apply_preview_title: Aplicar a combinação pré-visualizada?
    apply_preview_sub: 'Será aplicado: %combo%.'

preview:
    active_title: Pré-visualização ativa
    active_sub: Só você vê esta combinação. Os seus clientes continuam a ver a configuração ativa.
    close: Fechar
    apply: Aplicar
    title_with_names: 'Pré-visualização: %layout% · %theme%'
    closed_toast: Pré-visualização fechada

section:
    theme_title: Tema visual
    theme_desc: Cores, fundos e estilo.

card:
    preview_action: Pré-visualizar
    use_action: Usar
    active_label: Ativo

toast:
    save_error: Erro ao guardar
    applied: '✓ Alteração aplicada com sucesso'
    connection_error: Erro de ligação

layout:
    standard:
        name: Padrão
        desc: Cartões com imagem em cima e nome em baixo. Equilibrado e impactante.

theme:
    classic-dark:
        name: Clássico escuro
        desc: Preto profundo com destaque laranja e detalhes bronze. Moderno e urbano.
    glass:
        name: Glassmorphism
        desc: Degradê noturno com superfícies de vidro e destaque violeta. Moderno e premium.
    ocean:
        name: Oceano
        desc: Azul-água com faixa e títulos azul-marinho e destaque turquesa. Ideal para cozinha do mar.
    noir:
        name: Noir
        desc: Preto absoluto com detalhes dourado champanhe. Luxo e alta gastronomia.
    forest:
        name: Floresta
        desc: Verde-sálvia com faixa e títulos verde-floresta e detalhes em terracota. Perfeito para cozinha de mercado e produtos locais.
    maison:
        name: Clássico claro
        desc: Pergaminho e marfim com destaque vinho e detalhes em latão. Alta gastronomia e sofisticação.
