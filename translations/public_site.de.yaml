faq:
  eyebrow: "Häufige Fragen"
  title: "Bevor Sie fragen"
  q1:
    q: "Brauche ich eine Kreditkarte für die Testphase?"
    a: "Nein. Die 1-monatige Testphase ist völlig kostenlos, ohne Kreditkarte und ohne Verpflichtung."
  q2:
    q: "Kann ich meine bestehende Speisekarte importieren?"
    a: "Ja. Laden Sie ein Foto Ihrer aktuellen Speisekarte hoch, und die KI ordnet sie automatisch nach Kategorien und Gerichten."
  q3:
    q: "Müssen meine Kunden etwas installieren?"
    a: "Nein. Sie scannen den QR-Code und sehen die Speisekarte direkt im Browser ihres Handys."
  q4:
    q: "In wie vielen Sprachen kann meine Speisekarte angezeigt werden?"
    a: "Sie wird automatisch in mehr als 20 Sprachen übersetzt, ohne dass Sie etwas tun müssen."
  q5:
    q: "Was passiert, wenn der Testmonat endet?"
    a: "Wir informieren Sie rechtzeitig, bevor sich etwas ändert — darüber müssen Sie sich jetzt noch keine Gedanken machen."

features:
  eyebrow: "Funktionen"
  title: "Alles, was Ihre Speisekarte braucht"
  subtitle: "So gestaltet, dass ein Restaurant sie allein verwalten kann, ohne auf jemanden angewiesen zu sein."
  qr:
    title: "Digitale Speisekarte per QR"
    desc: "Ein QR-Code pro Tisch führt direkt zu Ihrer Speisekarte — ohne App, ohne Download für den Kunden."
  admin:
    title: "Verwaltungspanel"
    desc: "Fügen Sie Gerichte, Kategorien, Fotos und Preise in Sekunden hinzu — vom Handy oder Computer aus."
  smart_waiter:
    title: "Smart Waiter (KI-Chat)"
    desc: "Ihre Kunden fragen nach Allergenen, Zutaten oder Empfehlungen und erhalten sofort eine Antwort."
  stats:
    title: "Statistiken"
    desc: "Welche Gerichte am meisten angesehen werden und wie der Chat genutzt wird — nützliche Daten für Ihre Speisekarte, kein technisches Rauschen."
  multilang:
    title: "Mehrsprachig"
    desc: "Ihre Speisekarte wird automatisch in mehr als 20 Sprachen übersetzt, damit jeder Kunde sie in seiner eigenen versteht."
  multicurrency:
    title: "Mehrere Währungen"
    desc: "Wählen Sie die Währung Ihrer Speisekarte — Euro, Dollar und mehr — und alle Preise werden stets korrekt angezeigt."
  fixed_menus:
    title: "Menüs zum Festpreis"
    desc: "Tagesmenü, Degustationsmenü — mit eigenen Preisen und eigener Struktur, getrennt von der normalen Speisekarte."
  themes:
    title: "Visuelle Themes"
    desc: "Mehrere Stile und Farben, damit die Speisekarte zum Erscheinungsbild Ihres Restaurants passt."

