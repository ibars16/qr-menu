    title: "Speisekarte erstellen"
    desc: "Fügen Sie Kategorien und Gerichte hinzu oder importieren Sie Ihre aktuelle Speisekarte, um sich die manuelle Arbeit zu sparen."
  step3:
    title: "QR-Code teilen"
    desc: "Laden Sie Ihren QR-Code herunter, drucken Sie ihn auf die Tische, und Ihre digitale Speisekarte ist live."

