email_change:
    subject: "Confirmez votre nouvel e-mail"
    intro: "Vous avez demandé à vous connecter à %app% avec %new% au lieu de %old%. Confirmez-le pour effectuer le changement."
    button: "Confirmer le nouvel e-mail"
    expiry: "Le lien expire dans 7 jours. Tant que vous ne l'avez pas confirmé, vous continuez à vous connecter avec votre e-mail actuel."
    ignore: "Si vous n'êtes pas à l'origine de cette demande, ignorez cet e-mail : rien ne change."
email_changed:
    subject: "Votre e-mail de connexion a changé"
