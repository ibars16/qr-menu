faq:
  eyebrow: "Domande frequenti"
  title: "Prima che tu chieda"
  q1:
    q: "Serve la carta di credito per la prova?"
    a: "No. La prova di 1 mese è completamente gratuita, senza carta né impegno."
  q2:
    q: "Posso importare il menu che ho già?"
    a: "Sì. Carica una foto del tuo menu attuale e l'IA lo organizza automaticamente per categorie e piatti."
  q3:
    q: "I miei clienti devono installare qualcosa?"
    a: "No. Scansionano il codice QR e vedono il menu direttamente nel browser del cellulare."
  q4:
    q: "In quante lingue può essere mostrato il mio menu?"
    a: "Viene tradotto automaticamente in 20 lingue, senza che tu debba fare nulla."
  q5:
    q: "Cosa succede quando finisce il mese di prova?"
    a: "Il tuo menu viene messo in pausa finché non scegli un piano. Non viene addebitato nulla automaticamente, perché non ti chiediamo la carta."
  price:
    q: "Quanto costa?"
    a: "%monthly% al mese o %yearly% all'anno, IVA inclusa. Un solo piano con tutto incluso, e il primo mese è gratuito, senza carta."

features:
  eyebrow: "Funzionalità"
  title: "Tutto ciò che serve al tuo menu"
  subtitle: "Pensato per essere gestito da un ristorante da solo, senza dipendere da nessuno."
  qr:
    title: "Menu digitale tramite QR"
    desc: "Un QR code per tavolo porta direttamente al tuo menu, senza app né download per il cliente."
  import:
    title: "Importa il menu con una foto"
    desc: "Scatta una foto del tuo menu cartaceo: l'IA lo legge e lo organizza in categorie e piatti. Tu devi solo controllarlo."
  smart_waiter:
    title: "Cameriere IA"
    desc: "I tuoi clienti chiedono di allergeni, ingredienti o consigli e ricevono una risposta immediata."
  allergens:
    title: "14 allergeni ufficiali"
    desc: "I 14 allergeni a dichiarazione obbligatoria nell'UE, segnalati su ogni piatto e ben visibili ai tuoi clienti."
  multilang:
    title: "20 lingue"
    desc: "Il tuo menu viene tradotto automaticamente in 20 lingue, così ogni cliente lo capisce nella propria."
  multicurrency:
    title: "Multivaluta"
    desc: "Scegli la valuta del tuo menu — euro, dollari e altro — e tutti i prezzi vengono sempre mostrati correttamente."
  stats:
    title: "Statistiche"
    desc: "Quali piatti vengono visti di più e come viene usata la chat — dati utili per il tuo menu, senza rumore tecnico."
  themes:
    title: "Temi visivi"
    desc: "Diversi stili e colori per far combaciare il menu con l'immagine del tuo ristorante."

