    use_theme_sub: Se aplicará de inmediato y todos tus clientes verán el nuevo tema.
    apply_preview_title: '¿Aplicar combinación previsualizada?'
    apply_preview_sub: 'Se aplicará: %combo%.'

preview:
    active_title: Vista previa activa
    active_sub: Solo tú ves esta combinación. Tus clientes siguen viendo la configuración activa.
    close: Cerrar
    apply: Aplicar
    title_with_names: 'Vista previa: %layout% · %theme%'
    closed_toast: Vista previa cerrada

section:
    layout_title: Layout del menú
    layout_desc: Elige cómo se organizan los platos en la pantalla.
    theme_title: Tema visual
    theme_desc: Colores, fondos y estilo. La vista Cuadrícula solo está disponible con Maison.

card:
    preview_action: Vista previa
    use_action: Usar
    active_label: Activo
    requires_theme: 'Disponible con el tema %theme%'

toast:
    save_error: Error al guardar
    applied: '✓ Cambio aplicado correctamente'
    connection_error: Error de conexión

layout:
    standard:
        name: Estándar
        desc: Tarjetas con imagen arriba y nombre abajo. Equilibrado e impactante.
    grid:
        name: Cuadrícula
        desc: Más visual. Recomendada si la mayoría de tus platos tienen foto. Si tu clientela prefiere algo más sencillo, usa la lista.

theme:
    classic-dark:
        name: Clásico oscuro
        desc: Fondo negro, acento del color de tu marca. Elegante y sofisticado.
    classic-warm:
        name: Clásico cálido
        desc: Fondo crema, tonos cálidos. Acogedor y cercano.
    glass:
        name: Glassmorphism
        desc: Degradado oscuro con efecto cristal y acento morado. Moderno y premium.
    ocean:
        name: Océano
        desc: Azul claro, limpio y fresco. Ideal para cocina del mar.
    noir:
        name: Noir
        desc: Negro profundo con detalles dorados. Lujo y alta gastronomía.
    forest:
        name: Bosque
        desc: Verde natural y orgánico. Perfecto para cocina de mercado y productos locales.
    terra:
        name: Terra
        desc: Terracota mediterránea. Ideal para tapas, pintxos y cocina informal.
    maison:
        name: Maison
        desc: Pergamino, marfil y vino, con tipografía serif editorial. Alta gastronomía y sofisticación.
