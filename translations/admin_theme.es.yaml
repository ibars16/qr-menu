    preview_action: Vista previa
    use_action: Usar
    active_label: Activo

toast:
    save_error: Error al guardar
    applied: '✓ Cambio aplicado correctamente'
    connection_error: Error de conexión

layout:
    standard:
        name: Estándar
        desc: Tarjetas con imagen arriba y nombre abajo. Equilibrado e impactante.

theme:
    classic-dark:
        name: Clásico oscuro
        desc: Negro profundo con acento naranja y detalles bronce. Moderno y urbano.
    glass:
        name: Glassmorphism
        desc: Degradado nocturno con superficies de cristal y acento violeta. Moderno y premium.
    ocean:
        name: Océano
        desc: Azul agua con portada y títulos azul marino y acento turquesa. Ideal para cocina del mar.
    noir:
        name: Noir
        desc: Negro absoluto con detalles dorado champán. Lujo y alta gastronomía.
    forest:
        name: Bosque
        desc: Verde salvia con portada y títulos verde bosque y detalles terracota. Perfecto para cocina de mercado y productos locales.
    maison:
        name: Clásico claro
        desc: Pergamino y marfil con acento vino y detalles de latón. Alta gastronomía y sofisticación.
