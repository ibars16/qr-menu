    active_title: Vista previa activa
    active_sub: Solo tú ves esta combinación. Tus clientes siguen viendo la configuración activa.
    close: Cerrar
    apply: Aplicar
    title_with_names: 'Vista previa: %layout% · %theme%'
    closed_toast: Vista previa cerrada

section:
    theme_title: Tema visual
    theme_desc: Colores, fondos y estilo.

