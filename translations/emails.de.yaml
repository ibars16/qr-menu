    confirm_intro: "Bestätigen Sie Ihre E-Mail, um Ihre Karte zu veröffentlichen: bis dahin sehen nur Sie sie."
reset:
    subject: "Ändern Sie Ihr Passwort"
    intro: "Wir haben eine Anfrage erhalten, das Passwort Ihres Kontos zu ändern."
