    ignore: "Wenn Sie das nicht angefordert haben, ignorieren Sie diese E-Mail: Ihr Passwort bleibt unverändert."
confirm:
    subject: "Bestätigen Sie Ihre E-Mail"
    intro: "Bestätigen Sie, dass das Ihre E-Mail ist, damit Ihre Gäste Ihre Karte sehen können."
    button: "Meine E-Mail bestätigen"
    expiry: "Der Link ist 7 Tage gültig. Danach können Sie in Ihrem Panel einen neuen anfordern."
    ignore: "Wenn Sie dieses Konto nicht erstellt haben, ignorieren Sie diese E-Mail."
email_change:
    subject: "Bestätigen Sie Ihre neue E-Mail"
    intro: "Sie möchten sich bei %app% mit %new% statt %old% anmelden. Bestätigen Sie es, damit die Änderung wirksam wird."
    button: "Neue E-Mail bestätigen"
    expiry: "Der Link läuft in 7 Tagen ab. Bis zur Bestätigung melden Sie sich weiter mit Ihrer bisherigen E-Mail an."
    ignore: "Wenn Sie das nicht angefordert haben, ignorieren Sie diese E-Mail: Es ändert sich nichts."
email_changed:
    subject: "Ihre Anmelde-E-Mail wurde geändert"
    intro: "Ab jetzt meldet sich dieses Konto mit %new% an. Mit dieser E-Mail ist keine Anmeldung mehr möglich."
    not_you: "Wenn Sie das nicht waren, kontaktieren Sie so schnell wie möglich den %app%-Support."
smart_waiter_down:
    subject: "Der Assistent Ihrer Karte antwortet gerade nicht"
    hello: "Hallo,"
    intro: "Der KI-Assistent der Karte von %restaurant% antwortet wegen eines technischen Problems gerade nicht. Wir sind bereits informiert."
    meanwhile: "Bitten Sie in der Zwischenzeit Ihr Team, die Fragen der Gäste zu Gerichten, Zutaten, Allergenen oder Empfehlungen persönlich zu beantworten."
    at_most: "Wir senden Ihnen höchstens einen solchen Hinweis pro Tag."
    signature: "Ihr %app%-Team"
