welcome:
    subject: "Willkommen bei %app%"
    hello: "Hallo!"
    ready: "Ihr Konto ist bereit."
    button: "Zu Ihrem Dashboard"
    login_with: "Sie melden sich mit dieser E-Mail-Adresse an: %email%"
    forgot: "Wenn Sie Ihr Passwort vergessen, nutzen Sie „Passwort vergessen?“ auf der Anmeldeseite."
    confirm_intro: "Bestätige deine E-Mail, um deine Karte zu veröffentlichen: bis dahin siehst nur du sie."
reset:
    subject: "Ändern Sie Ihr Passwort"
    intro: "Wir haben eine Anfrage erhalten, das Passwort Ihres Kontos zu ändern."
    button: "Passwort ändern"
    expiry: "Der Link läuft nach 1 Stunde ab und kann nur einmal verwendet werden."
    ignore: "Wenn Sie das nicht angefordert haben, ignorieren Sie diese E-Mail: Ihr Passwort bleibt unverändert."
confirm:
    subject: "Bestätige deine E-Mail"
    intro: "Bestätige, dass das deine E-Mail ist, damit deine Gäste deine Karte sehen können."
    button: "Meine E-Mail bestätigen"
    expiry: "Der Link ist 7 Tage gültig. Danach kannst du in deinem Panel einen neuen anfordern."
    ignore: "Wenn du dieses Konto nicht erstellt hast, ignoriere diese E-Mail."
email_change:
    subject: "Bestätige deine neue E-Mail"
    intro: "Du möchtest dich bei %app% mit %new% statt %old% anmelden. Bestätige es, damit die Änderung wirksam wird."
    button: "Neue E-Mail bestätigen"
    expiry: "Der Link läuft in 7 Tagen ab. Bis zur Bestätigung meldest du dich weiter mit deiner bisherigen E-Mail an."
    ignore: "Wenn du das nicht angefordert hast, ignoriere diese E-Mail: Es ändert sich nichts."
email_changed:
    subject: "Deine Anmelde-E-Mail wurde geändert"
    intro: "Ab jetzt meldet sich dieses Konto mit %new% an. Mit dieser E-Mail ist keine Anmeldung mehr möglich."
    not_you: "Wenn du das nicht warst, kontaktiere so schnell wie möglich den %app%-Support."
