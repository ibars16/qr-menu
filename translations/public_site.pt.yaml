faq:
  eyebrow: "Perguntas frequentes"
  title: "Antes que pergunte"
  q1:
    q: "Preciso de cartão de crédito para o teste?"
    a: "Não. O teste de 1 mês é totalmente gratuito, sem cartão nem compromisso."
  q2:
    q: "Posso importar a carta que já tenho?"
    a: "Sim. Carregue uma foto da sua carta atual e a IA organiza-a automaticamente por categorias e pratos."
  q3:
    q: "Os meus clientes têm de instalar alguma coisa?"
    a: "Não. Basta lerem o código QR e veem a carta diretamente no navegador do telemóvel."
  q4:
    q: "Em quantos idiomas pode ser mostrada a minha carta?"
    a: "É traduzida automaticamente para mais de 20 idiomas, sem que tenha de fazer nada."
  q5:
    q: "O que acontece quando termina o mês de teste?"
    a: "Avisamo-lo com antecedência antes de algo mudar — por agora não precisa de se preocupar com isso."

