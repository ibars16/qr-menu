faq:
  eyebrow: "Perguntas frequentes"
  title: "Antes que pergunte"
  q1:
    q: "Preciso de cartão de crédito para o teste?"
    a: "Não. O teste de 1 mês é totalmente gratuito, sem cartão nem compromisso."
  q2:
    q: "Posso importar a ementa que já tenho?"
    a: "Sim. Carregue uma foto da sua ementa atual e a IA organiza-a automaticamente por categorias e pratos."
  q3:
    q: "Os meus clientes têm de instalar alguma coisa?"
    a: "Não. Basta lerem o código QR e veem a ementa diretamente no navegador do telemóvel."
  q4:
    q: "Em quantos idiomas pode ser mostrada a minha ementa?"
    a: "É traduzida automaticamente para 20 idiomas, sem que tenha de fazer nada."
  q5:
    q: "O que acontece quando termina o mês de teste?"
    a: "A sua ementa fica em pausa até escolher um plano. Não é cobrado nada automaticamente, porque não lhe pedimos o cartão."
  price:
    q: "Quanto custa?"
    a: "%monthly% por mês ou %yearly% por ano, IVA incluído. Um único plano com tudo incluído, e o primeiro mês é grátis, sem cartão."

