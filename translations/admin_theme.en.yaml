    cancel: Cancel
    apply_now: Apply now
    applying: Applying…
    use_layout_title: 'Use the "%name%" layout?'
    use_layout_sub: This will be applied immediately and all your customers will see the new layout.
    use_theme_title: 'Use the "%name%" theme?'
    use_theme_sub: This will be applied immediately and all your customers will see the new theme.
