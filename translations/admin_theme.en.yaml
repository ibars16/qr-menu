    active_title: Preview active
    active_sub: Only you can see this combination. Your customers still see the active configuration.
    close: Close
    apply: Apply
    title_with_names: 'Preview: %layout% · %theme%'
    closed_toast: Preview closed

section:
    layout_title: Menu layout
    layout_desc: Choose how dishes are organized on screen.
    theme_title: Visual theme
    theme_desc: Colors, backgrounds and style. The Grid view is only available with Maison.

card:
    preview_action: Preview
    use_action: Use
    active_label: Active
    requires_theme: 'Available with the %theme% theme'

toast:
    save_error: Error saving
    applied: '✓ Change applied successfully'
    connection_error: Connection error

layout:
    standard:
        name: Standard
        desc: Cards with an image on top and the name below. Balanced and eye-catching.
    grid:
        name: Grid
        desc: More visual. Recommended if most of your dishes have a photo. If your customers prefer something simpler, use the list.

theme:
    classic-dark:
        name: Classic dark
        desc: Black background with your brand color as the accent. Elegant and sophisticated.
    classic-warm:
        name: Classic warm
        desc: Cream background, warm tones. Cozy and welcoming.
    glass:
        name: Glassmorphism
        desc: Dark gradient with a glass effect and a purple accent. Modern and premium.
    ocean:
        name: Ocean
        desc: Light blue, clean and fresh. Ideal for seafood restaurants.
    noir:
        name: Noir
        desc: Deep black with gold details. Luxury and fine dining.
    forest:
        name: Forest
        desc: Natural, organic green. Perfect for market-style and local produce cuisine.
    terra:
        name: Terra
        desc: Mediterranean terracotta. Ideal for tapas, pintxos and casual dining.
    maison:
        name: Maison
        desc: Parchment, ivory and wine, with editorial serif type. Fine dining and sophistication.
