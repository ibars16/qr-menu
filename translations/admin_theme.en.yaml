layout:
    standard:
        name: Standard
        desc: Cards with an image on top and the name below. Balanced and eye-catching.

theme:
    classic-dark:
        name: Classic dark
        desc: Deep black with an orange accent and bronze details. Modern and urban.
    glass:
        name: Glassmorphism
        desc: Night-sky gradient with glass surfaces and a violet accent. Modern and premium.
    ocean:
        name: Ocean
        desc: Sea-water blue with a navy cover band and titles and a turquoise accent. Ideal for seafood restaurants.
    noir:
        name: Noir
        desc: Pure black with champagne-gold details. Luxury and fine dining.
    forest:
        name: Forest
        desc: Sage green with a forest-green cover band and titles and terracotta details. Perfect for market-style and local produce cuisine.
    maison:
        name: Classic light
        desc: Parchment and ivory with a wine accent and brass details. Fine dining and sophistication.
