faq:
  eyebrow: "FAQ"
  title: "Before you ask"
  q1:
    q: "Do I need a credit card for the trial?"
    a: "No. The 1-month trial is completely free, no card and no commitment."
  q2:
    q: "Can I import the menu I already have?"
    a: "Yes. Upload a photo of your current menu and the AI organizes it into categories and dishes automatically."
  q3:
    q: "Do my customers have to install anything?"
    a: "No. They scan the QR code and see the menu directly in their phone's browser."
  q4:
    q: "How many languages can my menu be shown in?"
    a: "It's automatically translated into 20 languages, with nothing for you to do."
  q5:
    q: "What happens when the trial month ends?"
    a: "Your menu is paused until you choose a plan. Nothing is charged automatically, because we never ask for your card."
  price:
    q: "How much does it cost?"
    a: "%monthly% a month or %yearly% a year, VAT included. One plan with everything included, and the first month is free, no card needed."

