    active_title: Vorschau aktiv
    active_sub: Nur Sie sehen diese Kombination. Ihre Kunden sehen weiterhin die aktive Konfiguration.
    close: Schließen
    apply: Anwenden
    title_with_names: 'Vorschau: %layout% · %theme%'
    closed_toast: Vorschau geschlossen

section:
    theme_title: Visuelles Design
    theme_desc: Farben, Hintergründe und Stil.

card:
    preview_action: Vorschau
    use_action: Verwenden
    active_label: Aktiv

toast:
    save_error: Fehler beim Speichern
    applied: '✓ Änderung erfolgreich angewendet'
    connection_error: Verbindungsfehler

layout:
    standard:
        name: Standard
        desc: Karten mit Bild oben und Namen unten. Ausgewogen und wirkungsvoll.

theme:
    classic-dark:
        name: Klassisch dunkel
        desc: Tiefschwarz mit orangem Akzent und Bronzedetails. Modern und urban.
    glass:
        name: Glassmorphism
        desc: Nachtblauer Verlauf mit Glasflächen und violettem Akzent. Modern und hochwertig.
    ocean:
        name: Ozean
        desc: Wasserblau mit marineblauem Titelband und Überschriften und türkisem Akzent. Ideal für Fischrestaurants.
    noir:
        name: Noir
        desc: Reines Schwarz mit champagnergoldenen Details. Luxus und Spitzengastronomie.
    forest:
        name: Wald
        desc: Salbeigrün mit waldgrünem Titelband und Überschriften und Terrakotta-Details. Perfekt für Marktküche und regionale Produkte.
    maison:
        name: Klassisch hell
        desc: Pergament und Elfenbein mit weinrotem Akzent und Messingdetails. Gehobene Küche und Eleganz.
