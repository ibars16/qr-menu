    use_theme_title: 'Design "%name%" verwenden?'
    use_theme_sub: Dies wird sofort angewendet und alle Ihre Kunden sehen das neue Design.
    apply_preview_title: Vorschau-Kombination anwenden?
    apply_preview_sub: 'Dies wird angewendet: %combo%.'

