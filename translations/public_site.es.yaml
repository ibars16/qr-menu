faq:
  eyebrow: "Preguntas frecuentes"
  title: "Antes de que preguntes"
  q1:
    q: "¿Necesito tarjeta de crédito para la prueba?"
    a: "No. La prueba de 1 mes es completamente gratuita, sin tarjeta ni compromiso."
  q2:
    q: "¿Puedo importar la carta que ya tengo?"
    a: "Sí. Sube una foto de tu carta actual y la IA la organiza por categorías y platos automáticamente."
  q3:
    q: "¿Mis clientes tienen que instalar algo?"
    a: "No. Escanean el código QR y ven la carta directamente en el navegador del móvil."
  q4:
    q: "¿En cuántos idiomas se puede ver mi carta?"
    a: "Se traduce automáticamente a 20 idiomas, sin que tengas que hacer nada."
  q5:
    q: "¿Qué pasa cuando termina el mes de prueba?"
    a: "Tu carta se pausa hasta que elijas un plan. No se cobra nada automáticamente, porque no te pedimos tarjeta."
  price:
    q: "¿Cuánto cuesta?"
    a: "%monthly% al mes o %yearly% al año, IVA incluido. Es un solo plan con todo incluido, y el primer mes es gratis y sin tarjeta."

