layout:
    standard:
        name: Standard
        desc: Schede con immagine sopra e nome sotto. Equilibrato ed efficace.

theme:
    classic-dark:
        name: Classico scuro
        desc: Nero profondo con accento arancione e dettagli bronzo. Moderno e urbano.
    glass:
        name: Glassmorphism
        desc: Sfumatura notturna con superfici di vetro e accento viola. Moderno e premium.
    ocean:
        name: Oceano
        desc: Azzurro acqua con fascia e titoli blu marino e accento turchese. Ideale per cucina di mare.
    noir:
        name: Noir
        desc: Nero assoluto con dettagli oro champagne. Lusso e alta cucina.
    forest:
        name: Foresta
        desc: Verde salvia con fascia e titoli verde bosco e dettagli in terracotta. Perfetto per cucina di mercato e prodotti locali.
    maison:
        name: Classico chiaro
        desc: Pergamena e avorio con accento vino e dettagli in ottone. Alta cucina e raffinatezza.
