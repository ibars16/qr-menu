; Base php:8.4-cli defaults (upload_max_filesize=2M, post_max_size=8M) are
; below UploadProfile::DishImage's own maxSizeBytes=8MB in
; src/Service/Upload/UploadValidator.php — a 2-8MB photo (any modern phone
; photo) was being silently truncated by PHP before ever reaching that
; validator. Set with headroom above the 8MB validator limit so the
; validator is the one that rejects an oversized file, with an honest
; message, instead of PHP doing it silently first.
upload_max_filesize = 10M
post_max_size = 12M
